[application]

name="Teste Co-op Caverna"
main_scene="res://main.tscn"
icon="res://icon.png"

[display]

width=400
height=480
stretch_mode="2d"
stretch_aspect="keep"
3ds_dual_screen=true

[input]

coop_a=[key(Return), key(Space), jbutton(0, 1)]
coop_b=[key(Escape), jbutton(0, 0)]
coop_x=[key(S), jbutton(0, 3)]
coop_y=[key(J), jbutton(0, 2)]
